<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grand Roulette</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="1920" height="1080"></canvas>

  <div id="dealer">
    <div class="screen">
      <img id="dealer-img" src="assets/dealer/dealer.png" alt="Dealer">
      <video id="dealer-video" muted playsinline preload="auto"></video>
      <div class="live"><span></span>LIVE</div>
      <div class="dname">ANNIE &middot; TABLE 7</div>
      <div id="caption"></div>
    </div>
  </div>

  <div id="board">
    <div class="head"><span class="title">LAST 20</span><span id="status"></span><div class="timerwrap"><div id="timer"></div></div></div>
    <div id="tokens"></div>
    <div id="stats"></div>
  </div>

  <div id="seats"></div>
  <div id="message"></div>

  <div id="bar">
    <div class="group"><div class="label">BALANCE</div><div class="value" id="balance">0</div></div>
    <div class="group"><div class="label">ON THE TABLE</div><div class="value" id="bet-total">0</div></div>
    <div id="tray">
      <button class="chip c1" data-v="1">1</button><button class="chip c5" data-v="5">5</button><button class="chip c25" data-v="25">25</button><button class="chip c100" data-v="100">100</button><button class="chip c500" data-v="500">500</button>
    </div>
    <button id="btn-undo" class="btn" title="Undo (U)">UNDO</button>
    <button id="btn-clear" class="btn" title="Clear (C)">CLEAR</button>
    <button id="btn-rebet" class="btn" title="Rebet (R)">REBET</button>
    <button id="btn-double" class="btn" title="Double (D)">&times;2</button>
    <button id="btn-spin" class="btn gold" title="Close bets and spin (Space)">SPIN</button>
    <div class="side"><button id="btn-help" class="btn icon" title="Help (H)">?</button><button id="btn-sound" class="btn icon" title="Mute (M)">&#128266;</button><input id="vol" type="range" min="0" max="1" step="0.01" title="Volume"></div>
  </div>

  <div id="help" class="hidden"><div class="panel"><h2>GRAND ROULETTE &mdash; PAYS &amp; RULES</h2><div id="help-body"></div><button id="help-close" class="btn gold">CLOSE</button></div></div>

  <div id="splash">
    <div class="inner">
      <img class="logo" src="assets/logo.png" alt="GRAND ROULETTE" onerror="this.style.display='none'">
      <div class="sub">EUROPEAN SINGLE ZERO &middot; LIVE DEALER &middot; FOUR SEATS</div>
      <div id="splash-text">LOADING&hellip;</div>
      <div class="note">Unofficial recreation &middot; play money only &middot; sound on</div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/table.js"></script>
<script src="js/audio.js"></script>
<script src="js/audio-roulette.js"></script>
<script src="js/fx.js"></script>
<script src="js/wheel.js"></script>
<script src="js/dealer.js"></script>
<script src="js/players.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
